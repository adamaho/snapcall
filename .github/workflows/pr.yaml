name: pr

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Lint and OpenAPI contract check
        run: pnpm turbo run lint openapi:check

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Format check
        run: pnpm run fmt:check

  tsc:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        run: pnpm turbo run tsc

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Unit tests
        run: pnpm turbo run test:unit

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: snapcall-ci
      SNAPCALL_POSTGRES_PORT: "5433"
      TEST_DATABASE_URL: postgresql://snapcall:snapcall@127.0.0.1:5433/snapcall
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Start infrastructure
        run: pnpm --filter @snapcall/infra-local infra:up

      - name: Integration tests
        run: pnpm test:integration

      - name: Remove integration infrastructure
        if: always()
        working-directory: infra/local
        run: docker compose down -v

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache turbo artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Setup pnpm and install
        uses: ./.github/actions/setup-pnpm

      - name: Build
        run: pnpm turbo run build
